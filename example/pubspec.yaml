name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.3
  # For Dio Kit
  dio: ^5.7.0

  # For get_connect kit
  get: ^4.6.6

  flutter_bloc: ^9.0.0

  cupertino_icons: ^2.0.0

  # UME façade（workspace 内解析为本地根包，无需 path）
  ume: ^2.0.6
  # 尚未发布到 pub.dev 的本地 kit（example 直接依赖以便演示）
  ume_kit_bloc_inspector: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: any
  flutter_lints: ^6.0.0
  vm_service: ^15.0.0

flutter:
  uses-material-design: true
