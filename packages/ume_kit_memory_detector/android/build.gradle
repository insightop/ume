group 'com.lijiaqi.ume_kit_memory_detector'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // 对齐 Flutter 3.50 插件模板；发布包不要跟随 example 取最新 AGP，
        // 否则会把消费者的 Gradle 下限抬到 9.6+。
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.lijiaqi.ume_kit_memory_detector'

    // Flutter 3.50 默认 compileSdk 为 36；依赖（androidx.* 1.7+/1.13+）要求 >= 34
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // 与 Flutter 3.50 默认 minSdk 对齐
        minSdk 24
    }
}
