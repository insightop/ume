name: ume_kit_channel_observer
description: Channel Observer for UME Kit
version: 2.0.3
homepage: https://github.com/insightop/ume/tree/master/packages/ume_kit_channel_observer

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ume_core: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.lijiaqi.ume_kit_channel_observer
        pluginClass: UmeKitChannelObserverPlugin
      ios:
        pluginClass: UmeKitChannelObserverPlugin

  assets:
    - assets/channel.png
