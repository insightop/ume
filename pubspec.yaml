# 虚拟 workspace 根包 —— 不对应 pub.dev 上的任何包。
#
# 遵循 Dart 官方 pub workspace 范式（dart.dev/tools/pub/workspaces，以及
# flutter-permission-handler / riverpod / drift / source_gen 等真实项目）：
#   根包 publish_to: none，真正发布的包都是它的成员。
#
# 这样做的原因：
#   1) 根 pubspec 的 workspace 字段不会被发布出去，故不会因为成员目录被
#      .pubignore 排除而在下游解析时报 "No workspace packages matching"；
#   2) example/ 可正常作为 workspace 成员（与官方插件一致）；
#   3) 发布逻辑统一为「每个包各自发布」，无特例。
name: ume_workspace
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - example
  # 所有可发布包（ume 本体 + ume_core + 各 kit）
  - packages/*
  # 各 kit 自带的演示 app
  - packages/*/example

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  melos: ^8.9.0
  mockito: ^5.3.2
  flutter_coverage_badge:
    git:
      url: https://github.com/smileShirely/flutter_coverage_badge.git
      ref: 59b7580f406bb712e9d9049c8c99212946e34f65

melos:
  useRootAsPackage: false
  command:
    bootstrap:
      runPubGetInParallel: true
    # 与 CI 保持一致：0 error 即通过，warning/info 不阻塞
    analyze:
      fatalInfos: false
      fatalWarnings: false
  scripts:
    test:
      exec:
        command: flutter test --enable-vmservice
        concurrency: 1
      packageFilters:
        dirExists: test
    analyze:
      exec:
        command: dart analyze --no-fatal-warnings .
      packageFilters:
        dirExists: lib
