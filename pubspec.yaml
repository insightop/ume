# 虚拟 workspace 根包 —— 不对应 pub.dev 上的任何包。
#
# 遵循 Dart 官方 pub workspace 范式（dart.dev/tools/pub/workspaces，以及
# riverpod / drift / source_gen 等真实项目）：
#   根包 publish_to: none，真正发布的包都是它的成员。
#
# 为什么根必须 publish_to: none（这是硬约束，不是风格偏好）：
#   `dart pub publish` 不会改写 pubspec，`workspace:` 会原样进入归档。而 pub
#   读取「依赖的 pubspec」与读取本地 pubspec 走同一套校验：一旦某个 workspace
#   条目在归档里不存在，下游执行 `dart pub deps`（或从子目录 `dart run`）就会
#   报 "No workspace packages matching ..." 并直接失败。
#   ume 2.0.8 正是这样发布的（当时根包 name: ume 可发布且带 workspace:），
#   修复只能靠补发新版本 —— 已发布的归档无法撤回。
#
#   因此规则是：**只有这个虚拟根可以声明 workspace:，且它永不发布。**
#   该约束由 tool/check_workspace_layout.dart 在 CI 中强制。
name: ume_workspace
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - example
  # 所有可发布包（ume 本体 + ume_core + 各 kit）
  - packages/*
  # 各 kit 自带的演示 app（glob：新增 kit 的 example/ 自动纳入）
  - packages/*/example

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  melos: ^8.9.0
  mockito: ^5.3.2
  flutter_coverage_badge:
    git:
      url: https://github.com/smileShirely/flutter_coverage_badge.git
      ref: 59b7580f406bb712e9d9049c8c99212946e34f65

melos:
  useRootAsPackage: false
  command:
    # 与 CI 保持一致：0 error 即通过，warning/info 不阻塞
    analyze:
      fatalInfos: false
      fatalWarnings: false
  scripts:
    test:
      exec:
        command: flutter test --enable-vmservice
        concurrency: 1
      packageFilters:
        dirExists: test
    analyze:
      exec:
        command: dart analyze --no-fatal-warnings .
      packageFilters:
        dirExists: lib
