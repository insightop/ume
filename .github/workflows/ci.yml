name: CI

# 质量门禁：静态分析 + 逐包测试 + example 全平台构建
# 单仓库 pub workspace：根目录一次 `pub get` 覆盖全部成员包。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------- 静态分析
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # workspace 布局守卫：必须早于 `pub get` 运行。
      # 悬空 workspace 条目会让 pub 自身解析失败，届时再检查已无意义。
      # 该脚本刻意零依赖（仅 dart:io），在 workspace 已损坏时仍可运行。
      - name: Check workspace layout
        run: dart tool/check_workspace_layout.dart

      # workspace 根解析一次，覆盖所有成员包
      - name: Resolve workspace
        run: flutter pub get

      # 0 error 即通过；warning/info 不阻塞（存量 lint 较多，逐步清理）
      # 注意：dart analyze 只有 --fatal-infos（info 默认不致命），故只需关闭 warning 致命
      - name: dart analyze
        run: dart analyze --no-fatal-warnings .

  # ------------------------------------------------------------------ 单元测试
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        # 仅包含「有 test/ 目录」的包；无测试的 kit 会被跳过（而非失败）。
        package:
          - example
          - packages/ume_core
          - packages/ume_kit_channel_observer
          - packages/ume_kit_clean_local_data
          - packages/ume_kit_console
          - packages/ume_kit_database
          - packages/ume_kit_dio
          - packages/ume_kit_get_connect
          - packages/ume_kit_git
          - packages/ume_kit_memory_detector
          - packages/ume_kit_perf
          - packages/ume_kit_shared_preferences
          - packages/ume_kit_show_code
          - packages/ume_kit_ui
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # workspace 成员直接在该包目录内跑测试，沿用仓库原有约定。
      # --enable-vmservice：ume_core / ume_kit_show_code 的测试依赖 VM Service
      #   （ServiceWrapper 会连接测试进程自身的 VM Service），无该 flag 会失败。
      # 若无 test/ 目录则跳过（避免新增 kit 尚未写测试时 CI 变红）。
      - name: flutter test
        shell: bash
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ ! -d test ]; then
            echo "::notice::${{ matrix.package }} 没有 test/ 目录，跳过"
            exit 0
          fi
          flutter test --enable-vmservice

      - name: Git panel with injected build metadata
        if: matrix.package == 'packages/ume_kit_git'
        working-directory: packages/ume_kit_git
        run: dart run ume_kit_git:flutter test test/git_info_test.dart

  # ------------------------------------------------------------ example 构建
  # 全平台构建矩阵。example/ 下的平台目录由 Flutter 官方模板生成，这里只做构建验证。
  # Web 暂不纳入：ume_core 依赖 vm_service_io（dart:io），memory_detector 依赖
  # dart:ffi，当前代码无法编译到 web；接入前需要先做条件化导入/导出。
  build-example:
    name: Build example (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
          - platform: macos
            os: macos-latest
            command: flutter build macos --debug
          - platform: windows
            os: windows-latest
            command: flutter build windows --debug
          - platform: linux
            os: ubuntu-latest
            command: flutter build linux --debug
    steps:
      - uses: actions/checkout@v7

      # Android 构建需要 JDK 17；其他平台不依赖 Java。
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Linux 桌面构建需要 GTK/CMake/Ninja 工具链。
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Resolve workspace
        run: flutter pub get

      - name: Build
        working-directory: example
        run: ${{ matrix.command }}

      # 重命名 APK，artifact 用语义化文件名。
      - name: Rename APK
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          SRC="example/build/app/outputs/flutter-apk/app-debug.apk"
          DEST="example/build/app/outputs/flutter-apk/ume-example-android-debug.apk"
          mv "$SRC" "$DEST"
          ls -lh "$DEST"

      - name: Upload APK artifact
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: ume-example-android-debug
          path: example/build/app/outputs/flutter-apk/ume-example-android-debug.apk
          if-no-files-found: error
          retention-days: 7
