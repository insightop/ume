name: Publish to pub.dev

# 通过 git tag 触发发布，使用 pub.dev 的 GitHub OIDC 免密认证。
#
# 为什么不用 dart-lang 的 reusable workflow？
#   该 workflow 内部执行 `dart pub publish --dry-run`（未加 --ignore-warnings），
#   而 pub 在「存在 warning 时」返回退出码 65。各 kit 有存量 lint 提示
#   （deprecated API / 文档注释格式等），会导致发布永远在 dry-run 步骤失败。
#   官方文档亦提供了自定义 workflow 的写法（同样走 OIDC），见：
#   https://dart.dev/tools/pub/automated-publishing
#
# tag 约定（需与 pub.dev 后台 "Automated publishing" 里为每个包配置的 tag pattern 一致）：
#   ume 本体   -> v{{version}}              例如 v2.0.9
#   ume_core   -> ume_core-v{{version}}     例如 ume_core-v2.0.3
#   kit 包     -> <包名>-v{{version}}       例如 ume_kit_console-v2.0.4
#   包目录：ume 本体已迁至 packages/ume；其余为 packages/<包名>
#
# ⚠️ 模式里**不要使用方括号字符类**。GitHub 的 ref glob 不支持 `[a-z0-9_]`
#    这类写法（下划线尤其会触发 "invalid tags patterns"），一旦非法，
#    **整个 workflow 无法解析**：任何 push 都会生成一个 0 job 的失败 run，
#    连 master 分支推送也会（本该被 tags: 过滤器静默跳过）。
#    下面三个模式沿用仓库历史，均不含方括号。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"                  # ume 本体
      - "ume_core-v[0-9]+.[0-9]+.[0-9]+"
      - "ume_kit_*-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      package_dir:
        description: "要发布的包目录（相对仓库根），例如 packages/ume_kit_console"
        required: true
        type: string

jobs:
  # 从 tag 解析出「包目录」与「期望版本」，并校验与 pubspec 一致
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.resolve.outputs.package_dir }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # 发布前守卫：确保待发布的包不会把 workspace: 带进归档。
      # 2.0.8 正是带着该键发布的，导致下游 pub 解析失败。
      # 该脚本零依赖（仅 dart:io），在 workspace 已损坏时仍可运行。
      - name: Check workspace layout
        run: dart tool/check_workspace_layout.dart

      - name: Resolve package directory and version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIR="${{ inputs.package_dir }}"
            VERSION=""
          else
            TAG="${GITHUB_REF#refs/tags/}"

            # ume 本体用裸版本 tag（历史约定，如 v2.0.9）
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              DIR="packages/ume"
              VERSION="${BASH_REMATCH[1]}"
            # 其余包：<包名>-v<版本> -> packages/<包名>
            elif [[ "$TAG" =~ ^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              PKG="${BASH_REMATCH[1]}"
              VERSION="${BASH_REMATCH[2]}"
              DIR="packages/${PKG}"
            else
              echo "::error::无法从 tag '$TAG' 解析出包目录（期望 v<版本> 或 <包名>-v<版本>）"
              exit 1
            fi
          fi

          if [ ! -f "$DIR/pubspec.yaml" ]; then
            echo "::error::找不到 $DIR/pubspec.yaml"
            exit 1
          fi

          # 校验 tag 版本与 pubspec version 一致（workflow_dispatch 时跳过）
          if [ -n "$VERSION" ]; then
            SPEC_VERSION="$(grep -m1 -E '^version:' "$DIR/pubspec.yaml" | sed -E 's/^version:[[:space:]]*//' | tr -d '"'"'"'')"
            if [ "$SPEC_VERSION" != "$VERSION" ]; then
              echo "::error::tag 版本 ($VERSION) 与 $DIR/pubspec.yaml 版本 ($SPEC_VERSION) 不一致"
              exit 1
            fi
          fi

          echo "package_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "将发布: $DIR (version=${VERSION:-<dispatch>})"

  # 使用 dart-lang/setup-dart 注入 OIDC token，再自行执行 publish。
  publish:
    name: Publish ${{ needs.resolve.outputs.package_dir }}
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 认证所需（由 setup-dart 步骤换取临时 token）
    steps:
      - uses: actions/checkout@v4

      # 1) 注入 pub.dev 的 OIDC 凭据（必须最先执行）
      - uses: dart-lang/setup-dart@v1

      # 2) Flutter SDK —— kit 均为 Flutter 包，需要 flutter 提供的 dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        run: flutter pub get

      # 注意：--ignore-warnings 仅能与 --dry-run 同用（pub 源码 lish.dart 会校验）。
      # exit 65 只发生在 dry-run 分支的 `warningCount != 0` 时；
      # 真实发布路径不会因 warning 失败，--force 跳过确认提示。
      - name: Publish - dry run
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        run: dart pub publish --dry-run --ignore-warnings

      - name: Publish to pub.dev
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        run: dart pub publish --force

      # 发布后验证：从 pub.dev 拉回【刚发布的归档】，确认它不含 workspace:
      # 且在该归档内 `dart pub deps` 可用。
      #
      # 为什么发布成功了还要查：`dart pub publish` 校验的是工作区，打包用的是
      # `.pubignore` 过滤后的列表，二者可能不一致 —— 2.0.8 正是这样逃过全部
      # 检查发布的。发布无法撤回，所以一旦这里失败，唯一补救是立刻补发新版本；
      # 因此【故意让它失败】而不是 continue-on-error，避免坏归档被静默放过。
      - name: Verify published archive
        if: needs.resolve.outputs.version != ''
        env:
          PACKAGE_DIR: ${{ needs.resolve.outputs.package_dir }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tool/verify_published_archive.sh "${PACKAGE_DIR##*/}" "$VERSION"
