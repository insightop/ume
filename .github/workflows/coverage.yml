name: Coverage badges

# 在 master 上（源码变更时）为选定包重新生成覆盖率徽章并提交。
# 单仓库 pub workspace：根目录 `pub get` 后按包执行。
#
# 说明：
#   - 使用 `dart run` 取代已废弃的 `flutter pub run`
#   - 徽章产物由 bot 直接提交回 master，因此需要 contents: write
on:
  push:
    branches: [master]
    paths:
      - "packages/*/lib/**"
      - "packages/*/test/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badges:
    name: Regenerate coverage badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # 注：ume 本体不再生成徽章。它现在只是 packages/ume/lib/ume.dart 一份
      # 20 行的 export façade，没有 test/ 目录，也没有 coverage/lcov.info；
      # 此前的「Badge for ume」步骤读的是仓库根那份 2021 年的陈旧数据
      # （描述的还是后来拆到 ume_core 的代码），重构后直接报
      # PathNotFoundException 而失败。
      - name: Badge for ume_kit_device
        working-directory: packages/ume_kit_device
        run: dart run flutter_coverage_badge

      - name: Badge for ume_kit_perf
        working-directory: packages/ume_kit_perf
        run: dart run flutter_coverage_badge

      - name: Badge for ume_kit_show_code
        working-directory: packages/ume_kit_show_code
        run: dart run flutter_coverage_badge --exclude lib/show_code/syntax_highlighter.dart

      - name: Badge for ume_kit_ui
        working-directory: packages/ume_kit_ui
        run: dart run flutter_coverage_badge --exclude lib/third_party/cyclop

      - name: Badge for ume_kit_console
        working-directory: packages/ume_kit_console
        run: dart run flutter_coverage_badge

      - name: Badge for ume_kit_dio
        working-directory: packages/ume_kit_dio
        run: dart run flutter_coverage_badge

      - name: Commit badges
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ume_kit_device/coverage_badge.svg \
                  packages/ume_kit_perf/coverage_badge.svg \
                  packages/ume_kit_show_code/coverage_badge.svg \
                  packages/ume_kit_ui/coverage_badge.svg \
                  packages/ume_kit_console/coverage_badge.svg \
                  packages/ume_kit_dio/coverage_badge.svg
          if git diff --cached --quiet; then
            echo "徽章无变化，跳过提交"
          else
            git commit -m "chore: automated coverage badges [skip ci]"
            git push
          fi
