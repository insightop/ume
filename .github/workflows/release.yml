name: Release (all platforms + GitHub Release)

# 推送 v{{version}} tag 时：
#   1) 构建 example 的 Android / iOS / macOS / Windows / Linux 产物
#   2) 创建对应的 GitHub Release 并附加全部产物
#
# 与 publish.yml 配套：同一个 v{{version}} tag 既发布 ume 到 pub.dev，
# 也产出 GitHub Release。两者相互独立，互不阻塞。
#
# iOS 产物使用 --no-codesign，macOS 产物为 ad-hoc 签名，仅用于构建/分发验证；
# 真机安装需要自行签名。workflow_dispatch 传 dry_run=true 时只构建和打包，
# 不创建 Release。
#
# Web 暂不纳入：ume_core 依赖 vm_service_io（dart:io），memory_detector 依赖
# dart:ffi，当前代码无法编译到 web；接入前需要先做条件化导入/导出。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "要为其创建 Release 的 tag；dry_run 时可填任意 ref"
        required: true
        type: string
      dry_run:
        description: "只构建和打包，不创建 GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read   # 构建 job 只需要读仓库；写权限只给 release job

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            script: |
              flutter build apk --release
              mkdir -p dist
              cp build/app/outputs/flutter-apk/app-release.apk dist/ume-example-android.apk
          - platform: ios
            os: macos-latest
            script: |
              flutter build ios --release --no-codesign
              mkdir -p dist
              ditto -c -k --sequesterRsrc --keepParent \
                build/ios/iphoneos/Runner.app dist/ume-example-ios-unsigned.zip
          - platform: macos
            os: macos-latest
            script: |
              flutter build macos --release
              mkdir -p dist
              ditto -c -k --sequesterRsrc --keepParent \
                build/macos/Build/Products/Release/example.app dist/ume-example-macos.zip
          - platform: windows
            os: windows-latest
            script: |
              flutter build windows --release
              New-Item -ItemType Directory -Force dist | Out-Null
              Compress-Archive -Path build/windows/x64/runner/Release/* `
                -DestinationPath dist/ume-example-windows.zip
          - platform: linux
            os: ubuntu-latest
            script: |
              flutter build linux --release
              mkdir -p dist
              tar -czf dist/ume-example-linux.tar.gz \
                -C build/linux/x64/release/bundle .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Android 构建需要 JDK 17；其他平台不依赖 Java。
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Linux 桌面构建需要 GTK/CMake/Ninja 工具链。
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Resolve workspace
        run: flutter pub get

      - name: Build and package (bash)
        if: matrix.platform != 'windows'
        working-directory: example
        shell: bash
        run: ${{ matrix.script }}

      - name: Build and package (pwsh)
        if: matrix.platform == 'windows'
        working-directory: example
        shell: pwsh
        run: ${{ matrix.script }}

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ume-example-${{ matrix.platform }}
          path: example/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 只有这个 job 需要创建 Release
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ume-example-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
